# Schema for the `codeassembly` knowledge store.
#
# A `recordTypes:` block (see @codeassembly/kb) replaces the bundled default schema. Each record type declares its own
# required and optional fields plus its recall and immutability policy. A record's family is the stored `recordType`
# discriminant. The `event` record type is immutable and ULID-keyed (written by capture-event); the `assertion` record
# type is the existing note vocabulary.
recordTypes:
  event:
    immutable: true
    recall: recurrence-recency
    # `repo` is best-effort: capture resolves it from the git remote when one exists but never blocks on it, so it
    # stays optional rather than joining the required spine.
    required: [id, captured-at, session, cwd, summary]
    optional: [repo, skill, model, tags, correction, owner, locality, severity]
  assertion:
    recall: freshness
    required: [title, created, updated, tags]
    optional: [last-verified, applies-to, sources, supersedes, superseded-by]
