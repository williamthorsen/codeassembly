# claude.yaml

# Frontmatter this harness merges into each deployed subagent: _defaults for every agent, then per-agent overrides.

_defaults:
  permissionMode: bypassPermissions

orchestrated-architect:
  model: sonnet

orchestrated-coder:
  model: inherit
  memory: user

orchestrated-planner:
  model: sonnet

orchestrated-reviewer:
  model: inherit

aspect-code-reviewer:
  model: sonnet

aspect-silent-failure-reviewer:
  model: sonnet

aspect-test-reviewer:
  model: sonnet

code-simplification-reviewer:
  model: sonnet

planner:
  model: sonnet

plan-reviewer:
  model: sonnet

plan-reviser:
  model: sonnet
