# claude.yml

# Body-text tool-name mapping for the {tool:NAME} placeholder rewriter.
# Authoring guide: ../../_partials/README.md (Tool-name placeholders).
# Keys are canonical PascalCase tool names; values are platform-native names.
# Claude uses canonical names, so this is an identity mapping.
_tools:
  Bash: Bash
  Edit: Edit
  Glob: Glob
  Grep: Grep
  Read: Read
  Write: Write

_defaults:
  permissionMode: bypassPermissions

orchestrated-architect:
  model: sonnet

orchestrated-coder:
  model: inherit
  memory: user

orchestrated-planner:
  model: sonnet

orchestrated-reviewer:
  model: inherit

aspect-code-reviewer:
  model: sonnet

aspect-silent-failure-reviewer:
  model: sonnet

aspect-test-reviewer:
  model: sonnet

code-simplification-reviewer:
  model: sonnet

planner:
  model: sonnet

plan-reviewer:
  model: sonnet

plan-reviser:
  model: sonnet
