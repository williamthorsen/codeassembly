# rovo.yaml

# Frontmatter this harness merges into each deployed subagent: _defaults for every agent, then per-agent overrides.

_defaults:
  tools: [bash, create_file, expand_code_chunks, expand_folder, grep, open_files]

orchestrated-coder:
  tools: [bash, create_file, expand_code_chunks, expand_folder, find_and_replace_code, grep, open_files]

aspect-code-reviewer: {} # inherits _defaults

aspect-silent-failure-reviewer: {} # inherits _defaults

aspect-test-reviewer: {} # inherits _defaults

code-simplification-reviewer: {} # inherits _defaults

# Rovo reads no denylist, so the read-only grant is named here. `create_file` is dropped: the cutter returns text.
lede-cutter:
  tools: [bash, expand_code_chunks, expand_folder, grep, open_files]

# Rovo reads no denylist, so the read-only grant is named here. `create_file` is dropped: the drafter returns text.
lede-drafter:
  tools: [bash, expand_code_chunks, expand_folder, grep, open_files]

plan-reviewer: {} # inherits _defaults

plan-reviser: {} # inherits _defaults

# Edits prose in place and creates nothing: `create_file` is dropped, and `bash` with it, the reviser having no
# command to run.
prose-reviser:
  tools: [expand_code_chunks, expand_folder, find_and_replace_code, grep, open_files]
