# overrides.

_defaults:
  permissionMode: bypassPermissions

disposition-challenger:
  model: inherit

handoff-reviewer:
  model: sonnet

plan-reviewer:
  model: sonnet

plan-reviser:
  model: inherit

prose-reviser:
  model: inherit

usability-assessor:
  model: inherit
