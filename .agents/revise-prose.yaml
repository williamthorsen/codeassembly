      - packages/agents/content/_partials
      - packages/agents/content/codeassembly-content.yaml
      - packages/agents/content/collections
      - packages/agents/content/guidance
  williamthorsen-writing-preferences:
    version: '8'
    swept-at: 2026-09-14
    rules:
