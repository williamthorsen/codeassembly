artifacts:
  base_dir: ~/ai-artifacts
commit:
  title_format: '[{scope}|{type}: ]{title}'
editors:
  - extensions: '*.md'
    name: Webstorm
    command: webstorm # The file path will be appended to this command
integrations:
  jira:
    enabled: false
merge_commit:
  title_format: '[{ticket_ref} ][{scope}|{type}: ]{title}[ (#{pr_number})]'
platform: github
pr:
  title_format: '[{ticket_ref} ]{title}'
project:
  slug: codeassembly
  ticket_ref_prefix: '#' # ignored in file names
repository:
  default_remote:
    - name: origin
      default_branch: main
ticket:
  title_format: '{title}'
