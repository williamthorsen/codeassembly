artifacts:
  base_dir: ~/ai-artifacts
editors:
  - extensions: '*.md'
    name: Webstorm
    command: webstorm # The file path will be appended to this command
integrations:
  jira:
    enabled: false
platform: github
project:
  slug: codeassembly
  ticket_prefix: '#' # ignored in file names
repository:
  default_remote:
    - name: origin
      default_branch: main
