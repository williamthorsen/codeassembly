packages:
  - packages/*

catalog:
  '@testing-library/dom': '10.4.2'
  '@testing-library/jest-dom': '7.0.1'
  '@testing-library/react': '16.3.3'
  '@types/node': '24.19.2'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  '@vitejs/plugin-react': '6.1.2'
  '@williamthorsen/change-grammar': '0.3.0'
  '@williamthorsen/nmr': '0.50.1'
  '@williamthorsen/toolbelt.errors': '0.8.4'
  '@williamthorsen/toolbelt.terminal': '0.2.1'
  '@williamthorsen/toolbelt.testing': '0.7.0'
  '@williamthorsen/toolbelt.vitest': '0.11.0'
  esbuild: '0.28.2'
  eslint: '10.13.0'
  eslint-plugin-react: '7.37.5'
  happy-dom: '21.0.3'
  prettier: '3.9.10'
  react: '19.3.1'
  react-dom: '19.3.1'
  readyup: '0.43.0'
  vite: '8.3.4'
  vitest: '4.1.12'
  yaml: '2.9.1'
  zod: '4.6.7'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: false

savePrefix: ''

minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A 2023 backport of a ReDoS fix to the v6 line, published without provenance after 7.5.x had it;
  # Babel and eslint-plugin-react require semver ^6.
  - semver@6.3.1
