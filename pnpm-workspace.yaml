packages:
  - packages/*

catalog:
  '@williamthorsen/toolbelt.errors': '0.2.0'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  svelte-preprocess: true

savePrefix: ''

minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - readyup
  - v11y-check
