allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  node-pty: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: false

catalog:
  '@types/node': '24.19.2'
  '@williamthorsen/change-grammar': '0.3.1'
  '@williamthorsen/nmr': '0.56.0'
  '@williamthorsen/toolbelt.errors': '0.9.0'
  '@williamthorsen/toolbelt.terminal': '0.3.0'
  '@williamthorsen/toolbelt.testing': '0.8.0'
  '@williamthorsen/toolbelt.vitest': '0.13.2'
  esbuild: '0.28.2'
  eslint: '10.14.0'
  prettier: '3.9.10'
  readyup: '0.45.0'
  vite: '8.3.6'
  vitest: '5.1.0'
  yaml: '2.9.1'
  zod: '4.6.7'

minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)
# Published by the guidance repository's CI and consumed here right after release.
minimumReleaseAgeExclude:
  - codeassembly-guidance
  - '@williamthorsen/change-grammar@0.3.1'
  - '@williamthorsen/nmr-core@0.16.0'
  - '@williamthorsen/nmr@0.56.0'
  - '@williamthorsen/telefactor@0.4.1'
  - '@williamthorsen/toolbelt.arrays@6.4.1'
  - '@williamthorsen/toolbelt.numbers@7.3.1'
  - '@williamthorsen/toolbelt.strings@8.2.1'
  - '@williamthorsen/toolbelt.vitest@0.13.2'

packages:
  - packages/*

# eslint-plugin-react 7.37.5 declares ESLint up to 9 but runs on 10 under the shared config, which pins its React version
# because the plugin's `detect` mode calls an API that ESLint 10 removed.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A 2023 backport of a ReDoS fix to the v6 line, published without provenance after 7.5.x had it;
  # Babel, which eslint-plugin-react-hooks uses, requires semver ^6.
  - semver@6.3.1
