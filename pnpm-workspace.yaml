allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  node-pty: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: false

catalog:
  '@types/node': '24.19.2'
  '@williamthorsen/change-grammar': '0.4.1'
  '@williamthorsen/nmr': '2.3.0'
  '@williamthorsen/toolbelt.errors': '0.11.4'
  '@williamthorsen/toolbelt.terminal': '0.3.2'
  '@williamthorsen/toolbelt.testing': '0.9.0'
  '@williamthorsen/toolbelt.vitest': '0.14.0'
  esbuild: '0.28.2'
  eslint: '10.15.0'
  prettier: '3.10.1'
  readyup: '0.47.2'
  vite: '8.3.8'
  vitest: '5.1.1'
  yaml: '2.9.1'
  zod: '4.6.7'

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set explicitly to pin the policy, but exclude
# first-party packages so that a freshly published version can be consumed downstream without waiting out the soa
minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly-guidance
  - readyup
  - v11y-check

packages:
  - packages/*

# eslint-plugin-react 7.37.5 declares ESLint up to 9 but runs on 10 under the shared config, which pins its React version
# because the plugin's `detect` mode calls an API that ESLint 10 removed.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A 2023 backport of a ReDoS fix to the v6 line, published without provenance after 7.5.x had it;
  # Babel, which eslint-plugin-react-hooks uses, requires semver ^6.
  - semver@6.3.1
