packages:
  - packages/*

catalog:
  '@testing-library/dom': '10.4.1'
  '@testing-library/jest-dom': '7.0.1'
  '@testing-library/react': '16.3.2'
  '@types/node': '24.13.3'
  '@types/react': '19.2.18'
  '@types/react-dom': '19.2.5'
  '@vitejs/plugin-react': '6.1.0'
  '@williamthorsen/nmr': '0.34.0'
  '@williamthorsen/toolbelt.errors': '0.6.3'
  '@williamthorsen/toolbelt.testing': '0.5.0'
  '@williamthorsen/toolbelt.vitest': '0.8.0'
  esbuild: '0.28.2'
  eslint: '10.9.1'
  eslint-plugin-react: '7.37.5'
  hono: '4.13.4'
  jsdom: '30.0.1'
  react: '19.2.8'
  react-dom: '19.2.8'
  readyup: '0.35.0'
  vite: '8.2.2'
  vitest: '4.1.11'
  yaml: '2.9.0'
  zod: '4.4.3'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: false

savePrefix: ''

minimumReleaseAge: 1440 # 24h supply-chain soak (minutes)
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - readyup
  - v11y-check
