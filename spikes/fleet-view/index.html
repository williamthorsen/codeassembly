<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fleet view</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1b1e27;
        --line: #2a2e3b;
        --text: #e6e8ee;
        --muted: #8b90a0;
        --accent: #7aa2f7;
        --awaiting: #e0af68;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.1rem;
        font-weight: 600;
      }
      h1 .dir {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.85rem;
      }
      .empty {
        color: var(--muted);
        padding: 3rem 0;
        text-align: center;
        font-style: italic;
      }
      .lane {
        margin-bottom: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }
      .lane > h2 {
        margin: 0;
        padding: 0.6rem 0.9rem;
        font-size: 0.95rem;
        font-weight: 600;
        background: #21252f;
        border-bottom: 1px solid var(--line);
      }
      .lane > h2 .branch {
        color: var(--accent);
        font-weight: 500;
      }
      .session {
        padding: 0.6rem 0.9rem;
        border-top: 1px solid var(--line);
      }
      .session:first-of-type {
        border-top: none;
      }
      .session.stale {
        opacity: 0.5;
      }
      .session.ended {
        opacity: 0.45;
      }
      .session.ended .label {
        text-decoration: line-through;
      }
      .session.awaiting {
        border-left: 3px solid var(--awaiting);
        background: rgba(224, 175, 104, 0.07);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .sid {
        font-family: ui-monospace, monospace;
        color: var(--muted);
      }
      .badge {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .badge.claude {
        color: #bb9af7;
        border-color: #3b3357;
      }
      .badge.rovo {
        color: #7dcfff;
        border-color: #2b4a55;
      }
      .label {
        font-weight: 500;
      }
      .session.awaiting .label {
        color: var(--awaiting);
      }
      .age {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .tail {
        margin: 0.5rem 0 0;
        padding: 0.5rem 0.6rem;
        max-height: 9rem;
        overflow: auto;
        background: #0e0f14;
        border: 1px solid var(--line);
        border-radius: 6px;
        font:
          12px/1.5 ui-monospace,
          monospace;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>fleet view <span class="dir" id="conn">connecting…</span></h1>
    <div id="app"><div class="empty">connecting…</div></div>

    <script>
      let snapshot = { lanes: [] };

      const source = new EventSource('/events');
      source.onmessage = (event) => {
        try {
          snapshot = JSON.parse(event.data);
        } catch (error) {
          return;
        }
        setConn('live');
        render();
      };
      source.onopen = () => setConn('live');
      source.onerror = () => setConn('reconnecting…');

      // Re-render every second so last-event ages tick between server pushes.
      setInterval(render, 1000);
      render();

      function render() {
        const app = document.getElementById('app');
        const lanes = snapshot.lanes ?? [];
        if (lanes.length === 0) {
          app.innerHTML = '<div class="empty">no events yet</div>';
          return;
        }
        app.innerHTML = lanes.map(renderLane).join('');
      }

      function renderLane(lane) {
        return `<section class="lane">
        <h2>${esc(lane.repo)} <span class="branch">${esc(lane.branch)}</span></h2>
        ${(lane.sessions ?? []).map(renderSession).join('')}
      </section>`;
      }

      function renderSession(session) {
        const status = session.status ?? {};
        const classes = ['session'];
        if (status.awaitingInput) classes.push('awaiting');
        if (status.ended) classes.push('ended');
        if (status.stale) classes.push('stale');
        const harness = session.harness || 'unknown';
        const tail = (session.tail ?? []).map(formatEvent).join('\n');
        return `<div class="${classes.join(' ')}">
        <div class="row">
          <span class="sid">${esc(shortId(session.session))}</span>
          <span class="badge ${esc(harness)}">${esc(harness)}</span>
          <span class="label">${esc(status.label ?? '')}</span>
          <span class="age">${esc(ageText(session.lastEventTs))}</span>
        </div>
        <pre class="tail">${esc(tail)}</pre>
      </div>`;
      }

      // Render one tail line as time + type + payload; the client never interprets payloads.
      function formatEvent(event) {
        const time = typeof event.ts === 'string' ? event.ts.slice(11, 19) : '';
        const payload = event.payload ? JSON.stringify(event.payload) : '';
        return `${time} ${event.type ?? ''} ${payload}`.trim();
      }

      function ageText(tsIso) {
        const ms = Date.now() - Date.parse(tsIso);
        if (!Number.isFinite(ms)) return '—';
        const seconds = Math.max(0, Math.round(ms / 1000));
        if (seconds < 60) return `${seconds}s ago`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ${seconds % 60}s ago`;
        const hours = Math.floor(minutes / 60);
        return `${hours}h ${minutes % 60}m ago`;
      }

      function shortId(id) {
        return typeof id === 'string' ? id.slice(0, 8) : '?';
      }

      function setConn(text) {
        document.getElementById('conn').textContent = text;
      }

      function esc(value) {
        return String(value).replace(
          /[&<>"]/g,
          (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character],
        );
      }
    </script>
  </body>
</html>
